name: Stability regressions

on:
  pull_request:
    paths:
      - 'app/src/main/java/me/bmax/apatch/util/AppData.kt'
      - 'app/build.gradle.kts'
      - 'scripts/test_stability.py'
      - 'scripts/test_kernel_artifacts.py'
      - 'gradle/wrapper/**'
      - '.github/workflows/stability.yml'
  push:
    branches: [main, develop]
    paths:
      - 'app/src/main/java/me/bmax/apatch/util/AppData.kt'
      - 'app/build.gradle.kts'
      - 'scripts/test_stability.py'
      - 'scripts/test_kernel_artifacts.py'
      - 'gradle/wrapper/**'
      - '.github/workflows/stability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Prepare wrapper compiler cache
        run: ./gradlew --version
      - name: Count workers and verify query isolation
        run: python3 scripts/test_stability.py
      - name: Verify the unpatched code fails
        run: python3 scripts/test_stability.py --baseline-ref 6b2a37d7 --expect-regression
      - name: Verify local artifact tasks and configuration-cache reuse
        run: python3 scripts/test_kernel_artifacts.py
