name: Build FolkPatch Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  KEYSTORE_FILE: debug.keystore
  KEYSTORE_PASSWORD: android
  KEY_ALIAS: androiddebugkey
  KEY_PASSWORD: android

jobs:
  build_release:
    name: Build Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-build-env

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > FolkPatch.jks

      - name: Create keystore.properties
        run: |
          cat > keystore.properties << 'EOF'
          KEYSTORE_FILE=../FolkPatch.jks
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      - run: ./gradlew assembleRelease --no-daemon

      - name: Capture APK Name
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "No release APK found"
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "APK_NAME=$(basename "$APK")" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: folkpatch-release-${{ github.sha }}
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
          fail_on_unmatched_files: true
